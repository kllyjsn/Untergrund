<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNTERGRUND player</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter+Tight:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #060607; color: #dedee3; font: 11px 'JetBrains Mono', ui-monospace, monospace; -webkit-font-smoothing: antialiased; overflow: hidden; }
    .player { box-sizing: border-box; height: 100%; min-height: 120px; display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid #222227; border-radius: 14px; background: radial-gradient(420px 160px at 0% 0%, rgba(255,43,43,.14), transparent 70%), #0b0b0d; }
    #art { flex: none; width: 96px; height: 96px; border-radius: 8px; overflow: hidden; background: #111; }
    #art canvas { width: 100%; height: 100%; display: block; }
    .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .brand { color: #ff2b2b; font-weight: 700; letter-spacing: .18em; font-size: 9px; }
    #title { margin: 0; font: 900 20px 'Inter Tight', system-ui, sans-serif; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
    #meta { color: #8a8a94; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track { height: 3px; background: #222227; border-radius: 2px; overflow: hidden; margin-top: 2px; }
    #bar { height: 100%; width: 0; background: #ff2b2b; transition: width .1s linear; }
    .links { display: flex; gap: 12px; align-items: center; }
    .links a, .links button { color: #dedee3; background: none; border: 0; padding: 0; font: inherit; font-size: 9px; font-weight: 700; letter-spacing: .12em; cursor: pointer; text-decoration: none; opacity: .7; }
    .links a:hover, .links button:hover { opacity: 1; }
    #play { flex: none; width: 64px; height: 64px; border-radius: 50%; border: 0; background: #ff2b2b; cursor: pointer; display: grid; place-items: center; box-shadow: 0 0 0 0 rgba(255,43,43,.5); transition: transform .15s; }
    #play:hover { transform: scale(1.05); }
    #play:disabled { opacity: .4; cursor: default; }
    #play i { width: 0; height: 0; border-left: 18px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 5px; }
    body.on #play i { width: 16px; height: 16px; border: 0; margin: 0; border-radius: 2px; background: #fff; }
    body.on #play { animation: beat 1s infinite; }
    @keyframes beat { 0% { box-shadow: 0 0 0 0 rgba(255,43,43,.45); } 100% { box-shadow: 0 0 0 14px rgba(255,43,43,0); } }
    @media (max-width: 360px) { #art { display: none; } }
  </style>
</head>
<body>
  <div class="player">
    <div id="art"></div>
    <div class="info">
      <div class="brand">UNTERGRUND</div>
      <h1 id="title">Loading…</h1>
      <div id="meta"></div>
      <div class="track"><div id="bar"></div></div>
      <div class="links"><a id="open" target="_blank" rel="noopener">REMIX IT ON UNTERGRUND.SH ↗</a><button id="copy" type="button">EMBED</button></div>
    </div>
    <button id="play" aria-label="Play" disabled><i></i></button>
  </div>
  <script type="module" src="js/embed.js"></script>
</body>
</html>
