name: Untergrund
options:
  bundleIdPrefix: sh.untergrund
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Untergrund:
    type: application
    platform: iOS
    sources:
      - path: Untergrund
        excludes:
          - Resources
    resources:
      - path: Untergrund/Resources/Assets.xcassets
    info:
      path: Untergrund/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.untergrund.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  UntergrundTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UntergrundTests
    dependencies:
      - target: Untergrund
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.untergrund.app.tests
schemes:
  Untergrund:
    build:
      targets:
        Untergrund: all
        UntergrundTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - UntergrundTests
    archive:
      config: Release
