# Fly.io config for the Club room service: `fly deploy` from the repo root. See README "Club Rooms deployment".
app = "untergrund-rooms"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ROOMS_ALLOWED_ORIGIN = "https://www.untergrund.sh,https://untergrund.sh"

[http_service]
  internal_port = 8080
  force_https = true
  # Rooms live in one process's memory, so run exactly one machine. It stops when nobody is
  # connected (state is saved to Redis when KV_REST_API_* secrets are set) and wakes on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
