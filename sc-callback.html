<!doctype html>
<meta charset="utf-8">
<title>UNTERGRUND · SoundCloud</title>
<body style="background:#060607;color:#ddd;font:13px monospace;display:grid;place-items:center;height:100vh;margin:0">
<p id="m">Connecting SoundCloud…</p>
<script type="module">
  import { completeCallback } from './js/soundcloud.js';
  const q = new URLSearchParams(location.search);
  const msg = { type: 'sc-auth', code: q.get('code'), state: q.get('state'), error: q.get('error_description') || q.get('error') };
  if (window.opener) {
    try { localStorage.setItem('untergrund.sc.callback', JSON.stringify({ ...msg, t: Date.now() })); } catch {}
    window.opener.postMessage(msg, location.origin); window.close();
  } else {
    try {
      const outcome = await completeCallback(msg);
      document.getElementById('m').textContent = outcome.error || 'Connected — you can close this tab.';
    } catch (error) { document.getElementById('m').textContent = error.message; }
  }
</script>
