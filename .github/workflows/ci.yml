name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  club-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:club-sync -- --assert
      - name: Upload rendered-audio sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: club-rendered-audio-sync
          path: test/out/club-sync.json
          if-no-files-found: warn

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check (js/, api/)
        run: find js api -name '*.js' -not -path 'js/vendor/*' -print0 | xargs -0 -n1 node --check
      - name: Install missing FFmpeg and Redis test dependencies
        run: |
          packages=()
          command -v ffmpeg || packages+=(ffmpeg)
          command -v redis-server || packages+=(redis-server)
          if (( ${#packages[@]} )); then
            # The EC2 mirror has exhausted the whole Linux job downloading FFmpeg.
            if grep -q '^http://us-east-2\.ec2\.archive\.ubuntu\.com/ubuntu/' /etc/apt/apt-mirrors.txt; then
              sudo sed -Ei \
                -e '/^http:\/\/us-east-2\.ec2\.archive\.ubuntu\.com\/ubuntu\// s/priority:1$/priority:2/' \
                -e '/^https:\/\/archive\.ubuntu\.com\/ubuntu\// s/priority:2$/priority:1/' \
                /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get update -q
            sudo apt-get install -yq --no-install-recommends "${packages[@]}"
          fi
      - run: npm test
      - run: npm run build
      - name: Smoke test server.mjs (SC_MOCK=1)
        run: scripts/smoke.sh

  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Select an iPhone Simulator
        id: simulator
        run: |
          id=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries | sort_by(.key) | reverse | map(.value[]) | map(select(.name | startswith("iPhone"))) | .[0].udid // empty')
          test -n "$id" || { echo "No available iPhone Simulator"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Build and test iOS app
        working-directory: ios
        run: |
          xcodebuild \
            -project Untergrund.xcodeproj \
            -scheme Untergrund \
            -derivedDataPath build \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Check app bundle includes compiled assets
        working-directory: ios
        run: test -f build/Build/Products/Debug-iphonesimulator/Untergrund.app/Assets.car
