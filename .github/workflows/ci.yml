name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      club_output_capture:
        description: Run the shared-clock Club output experiment
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  club-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ !inputs.club_output_capture }}
        run: npm run test:club-sync -- --assert
      - if: inputs.club_output_capture
        name: Interleave native-output controls and shared-clock captures
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils
          for order in host-first listener-first host-first; do
            for scenario in cold-invite-first-downbeat background-wake-mix; do
              flags=()
              if [[ "$scenario" == background-wake-mix ]]; then flags+=(--whole-step-test); fi
              n=$(( ${n:-0} + 1 ))
              npm run test:club-sync -- --assert --scenario "$scenario" "${flags[@]}" --output "$scenario-$n-native.json" || failed=1
              npm run test:club-sync -- --assert --scenario "$scenario" "${flags[@]}" --output "$scenario-$n-captured.json" --output-capture "$order" || failed=1
            done
          done
          exit "${failed:-0}"
      - name: Upload rendered-audio sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: club-rendered-audio-sync
          path: |
            test/out/club-sync.json
            test/out/*-native.json
            test/out/*-captured.json
            test/out/*-output.wav
          if-no-files-found: warn

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check (js/, api/)
        run: find js api -name '*.js' -not -path 'js/vendor/*' -print0 | xargs -0 -n1 node --check
      - name: Cache FFmpeg and Redis test binaries
        id: test-binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/untergrund-test-bin
          key: test-bin-${{ runner.os }}-${{ runner.arch }}-ffmpeg-6.0-redis-7.4.2-v1
      - name: Download pinned FFmpeg and Redis test binaries
        if: steps.test-binaries.outputs.cache-hit != 'true'
        run: |
          bin="$HOME/.cache/untergrund-test-bin"
          mkdir -p "$bin"
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-linux-x64.gz \
            -o "$RUNNER_TEMP/ffmpeg.gz"
          echo "17c1ae10b52ac499180679fe6ba77e17642390c4eedb0f1e3b0ac045da55128f  $RUNNER_TEMP/ffmpeg.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/ffmpeg.gz" > "$bin/ffmpeg"
          # Tests spawn their own redis-server on a random port, rather than a service.
          image=redis:7.4.2-bookworm@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
          container=$(docker create "$image")
          trap 'docker rm -f "$container"' EXIT
          docker cp "$container:/usr/local/bin/redis-server" "$bin/redis-server"
          chmod +x "$bin/ffmpeg" "$bin/redis-server"
      - name: Verify and expose test binaries
        run: |
          bin="$HOME/.cache/untergrund-test-bin"
          "$bin/ffmpeg" -version
          "$bin/redis-server" --version
          echo "$bin" >> "$GITHUB_PATH"
      - run: npm test
      - run: npm run build
      - name: Smoke test server.mjs (SC_MOCK=1)
        run: scripts/smoke.sh

  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Select an iPhone Simulator
        id: simulator
        run: |
          id=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries | sort_by(.key) | reverse | map(.value[]) | map(select(.name | startswith("iPhone"))) | .[0].udid // empty')
          test -n "$id" || { echo "No available iPhone Simulator"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Build and test iOS app
        working-directory: ios
        run: |
          xcodebuild \
            -project Untergrund.xcodeproj \
            -scheme Untergrund \
            -derivedDataPath build \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Check app bundle includes compiled assets
        working-directory: ios
        run: test -f build/Build/Products/Debug-iphonesimulator/Untergrund.app/Assets.car
