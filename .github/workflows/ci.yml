name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check (js/, api/)
        run: find js api -name '*.js' -not -path 'js/vendor/*' -print0 | xargs -0 -n1 node --check
      - name: ffmpeg (test/sound.mjs decodes the FLAC samples)
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg)
      - name: redis-server (test/rooms-concurrency.mjs runs the room Lua script on real Redis)
        run: command -v redis-server || (sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends redis-server)
      - run: npm test
      - run: npm run build
      - name: Smoke test server.mjs (SC_MOCK=1)
        run: scripts/smoke.sh

  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Select an iPhone Simulator
        id: simulator
        run: |
          id=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries | sort_by(.key) | reverse | map(.value[]) | map(select(.name | startswith("iPhone"))) | .[0].udid // empty')
          test -n "$id" || { echo "No available iPhone Simulator"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Build and test iOS app
        working-directory: ios
        run: |
          xcodebuild \
            -project Untergrund.xcodeproj \
            -scheme Untergrund \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            CODE_SIGNING_ALLOWED=NO \
            test
